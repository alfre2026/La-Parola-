const KV = {
  db: null,
  async init() {
    try { this.db = await new Promise((res, rej) => { const r = indexedDB.open('laparola', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

  },

    if (!this.db) { try { localStorage.setItem('lp_' + k, JSON.stringify(v)); } catch (e) { toast('Memoria piena: scarica un backup'); } return Promise.resolve(); }

  },
  del(k) {
    if (!this.db) { localStorage.removeItem('lp_' + k); return Promise.resolve(); }
    return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); });
  },

    return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); });
  }
};

/* ============ strati (fogli e pagine) con tasto Indietro ============ */
const layers = [];

const ACT = {};

const COLORS = [['Limone', '#FBEB7A'], ['Albicocca', '#FFC98A'], ['Salmone', '#FFA89A'], ['Rosa', '#FF9FC8'], ['Glicine', '#CFA6F0'], ['Pervinca', '#A9B0F5'],

async function loadBible(id) {
  const t = await KV.get('bible:' + id); if (!t) return false;
  BIBLE = t; BID = id; D.settings.bible = id; setTimeout(warmNorm, 1500); return true;
}
function normalizeBible(raw) {
  if (raw && !Array.isArray(raw) && Array.isArray(raw.books)) raw = raw.books;
  if (!Array.isArray(raw)) throw new Error('Formato non riconosciuto');
  const out = BOOKS.map(() => ({ chapters: [] })); let n = 0;
  raw.forEach((b, i) => {
    let idx = raw.length === 66 ? i : -1;
    if (idx < 0 && b.name) idx = bookIdx(b.name);
    if (idx < 0 && b.abbrev) idx = bookIdx(b.abbrev);
    if (idx < 0 || !Array.isArray(b.chapters)) return;
    out[idx] = { chapters: b.chapters.map(c => c.map(v => String(v).replace(/\s+/g, ' ').trim())) }; n++;
  });

  return out;
}
function parseBibleText(text) {
  const out = BOOKS.map(() => ({ chapters: [] })); let n = 0;
  for (const line of text.replace(/\r/g, '').split('\n')) {
    const m = /^\s*(.+?)\s+(\d{1,3})\s*[:,.]\s*(\d{1,3})\s+(\S.*)$/.exec(line); if (!m) continue;
    const bk = bookIdx(m[1]); if (bk < 0) continue;
    const ch = out[bk].chapters; while (ch.length < +m[2]) ch.push([]);
    const vs = ch[+m[2] - 1]; while (vs.length < +m[3] - 1) vs.push(''); vs[+m[3] - 1] = m[4].trim(); n++;
  }

}
async function installBible(id, name, bible) {
  await KV.set('bible:' + id, bible);

/* ----- rendering ----- */
function verseHTML(bk, ch, v, t, nts) {
  const ws = words(t), runs = D.hl[hkey(bk, ch, v)] || [], col = new Array(ws.length).fill(-1);
  runs.forEach(([a, b, c]) => { for (let i = a; i <= b && i < ws.length; i++) col[i] = c; });
  const notes = (nts || D.notes).filter(n => n.bk === bk && n.ch === ch && n.v1 <= v && v <= n.v2), ends = notes.filter(n => n.v2 === v);

  const wsp = (w, i) => `<span class="w" data-i="${i}">${esc(w)}</span>`;
  for (let i = 0; i < ws.length;) {

    let j = i; while (j + 1 < ws.length && col[j + 1] === col[i]) j++;

  }

}
function renderReader() {

  if (!BIBLE) {
    box.innerHTML = `<div class="empty" style="font-family:system-ui"><h2>Installa una Bibbia</h2>Scarica la <b>Riveduta 2020</b> (richiede internet una volta sola, poi funziona offline) oppure importa il tuo file, per esempio la <b>Nuova Riveduta 2006</b>.<div style="display:grid;gap:10px;margin-top:18px"><button class="btn" data-act="dlrived">${ic('down2')} Scarica Riveduta 2020</button><button class="btn sec" data-act="impbible">${ic('up2')} Importa file (JSON o testo)</button></div></div>`;
    $('#chnav').innerHTML = ''; return;
  }

  const pv = prevCh(), nx = nextCh();

}
/* ridisegna solo i versetti cambiati (colore, segnalibro) invece dell'intero capitolo */
function patchVerses(list) {

function prevCh() { if (S.ch > 1) return [S.bk, S.ch - 1]; for (let b = S.bk - 1; b >= 0; b--) if (hasBook(b)) return [b, nCh(b)]; return null; }

/* cronologia: i capitoli consultati, dal più recente; ogni capitolo compare una volta sola */

/* ----- selezione ----- */

/* Indici del testo mostrato, rifatti solo quando il testo cambia (DX = null):

/* maniglie per trascinare l'inizio e la fine della selezione di parole */

    if (runs.length) D.hl[k] = runs; else delete D.hl[k];

function paintRuns(runs, ws, we, ci) {
  const out = [];

    if (b < ws || a > we) { out.push([a, b, c]); continue; }
    if (a < ws) out.push([a, ws - 1, c]);
    if (b > we) out.push([we + 1, b, c]);
  }
  if (ci != null) out.push([ws, we, ci]);
  out.sort((x, y) => x[0] - y[0]);
  const m = []; for (const r of out) { const l = m[m.length - 1]; if (l && l[2] === r[2] && l[1] + 1 >= r[0]) l[1] = Math.max(l[1], r[1]); else m.push(r.slice()); }

}

    return `«${body}»\n${refLabel(rr(S.bk, S.ch, vs[0], vs[vs.length - 1]))} (${bibleName()})`;
  }
  return groupRuns(S.sel.verses).map(([a, b]) => { let s = ''; for (let v = a; v <= b; v++) s += `${b > a ? v + ' ' : ''}${verseTxt(S.bk, S.ch, v)} `; return `${refLabel(rr(S.bk, S.ch, a, b))}\n${s.trim()}`; }).join('\n\n') + ` (${bibleName()})`;

/* ----- note ----- */
function openNoteLayer(ctx) {
  return openLayer('sheet', d => {
    const c = d.ctx, n = c.id ? D.notes.find(x => x.id === c.id) : null, ref = n ? rr(n.bk, n.ch, n.v1, n.v2) : c.ref;
    let q = ''; for (let v = ref.v1; v <= Math.min(ref.v2, ref.v1 + 5); v++) q += `<sup>${v}</sup>${esc(verseTxt(ref.bk, ref.c1, v))} `;
    const quote = `<div class="vquote" style="font-size:15px">${q}${ref.v2 - ref.v1 > 5 ? '…' : ''}</div>`;
    if (c.editing || !n) return `<h2 class="t"><span class="ref">${esc(refLabel(ref))}</span> · nota</h2>${quote}<textarea id="noteTx" class="hand" placeholder="Scrivi la tua nota…" autofocus>${esc(n ? n.text : '')}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-act="notesave">${ic('check')} Salva</button><button class="btn sec" data-act="${n ? 'noteview' : 'close'}">Annulla</button></div>`;
    return `<h2 class="t"><span class="ref">${esc(refLabel(ref))}</span> · nota <span class="mut">${fmtDate(n.ts)}</span></h2>${quote}<div class="slip hand">${linkRefs(esc(n.text))}</div><div class="row w" style="margin-top:14px"><button class="btn sec" data-act="noteedit">${ic('pen')} Modifica</button><button class="btn sec" data-act="notegoto" data-bk="${n.bk}" data-c="${n.ch}" data-v="${n.v1}">${ic('book')} Vai al versetto</button><button class="btn sec" data-act="notedel">${ic('trash')} Elimina</button></div>`;
  }, { ctx });
}

  openLayer('sheet', () => `<h2 class="t">Note su questo versetto</h2>${ids.map(id => { const n = D.notes.find(x => x.id === id); return n ? `<div class="sr" data-act="noteopen" data-id="${id}"><span class="ref">${esc(refLabel(rr(n.bk, n.ch, n.v1, n.v2)))}</span><div class="clamp">${esc(n.text)}</div></div>` : ''; }).join('')}`);

/* ----- tocchi sul testo ----- */
let lastTap = { t: 0, v: 0, i: -1 };
function nearestWord(x, y) {   /* usa le posizioni già misurate: nessun ricalcolo del layout a ogni tocco o passo di trascinamento */
  const X = geom(); if (!X) return null;
  x += scrollX; y += scrollY;
  const R = X.rect, own = X.own; let best = -1, bd = 1e18;
  for (let j = 0, n = own.length; j < n; j++) {
    const l = R[4 * j], t = R[4 * j + 1], r = R[4 * j + 2], b = R[4 * j + 3];
    const dx = x < l ? l - x : x > r ? x - r : 0, dy = y < t ? t - y : y > b ? y - b : 0, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = j; }
  }
  return best < 0 ? null : { el: X.all[own[best]], d: Math.sqrt(bd) };
}
$('#text').addEventListener('click', e => {
  if (e.target.closest('[data-act]') || e.target.closest('.selh')) return;
  if (Date.now() - lastSelAt < 450) return;
  const g = getSelection(); if (g && !g.isCollapsed) return;
  let w = e.target.closest('.w'), vs = e.target.closest('.vs');
  if (!w) { const n = nearestWord(e.clientX, e.clientY); if (n && n.d <= 46) { w = n.el; vs = w.closest('.vs'); } }   /* spazio tra le righe e fine riga */
  if (!vs) { if (S.sel) clearSel(); return; }
  const v = +vs.dataset.v, i = w ? +w.dataset.i : -1, now = Date.now();
  if (w && lastTap.v === v && lastTap.i === i && now - lastTap.t < 400) { lastTap = { t: 0, v: 0, i: -1 }; startWord(v, i); return; }   /* doppio tocco: una parola */
  lastTap = { t: now, v, i };
  if (S.pick) { if (w) startWord(v, i); return; }
  if (S.sel && S.sel.words) { if (w) extendWord(v, i); return; }
  vs.classList.remove('flash'); toggleVerse(v);

/* trascinamento col dito: maniglie di inizio/fine, oppure doppio tocco su una parola e scorrimento */
let HD = null;

  const P = { v: +vs.dataset.v, i: +w.dataset.i }, F = HD.fixed;
  let A = F, B = P; if (B.v < A.v || (B.v === A.v && B.i < A.i)) [A, B] = [B, A];
  const cur = S.sel && S.sel.words; if (cur && cur.a.v === A.v && cur.a.i === A.i && cur.b.v === B.v && cur.b.i === B.i) return;
  const vset = new Set(); for (let k = A.v; k <= B.v; k++) vset.add(k);
  S.pick = null; S.extend = false; S.sel = { verses: vset, words: { a: A, b: B }, anchor: F, native: false }; paintSel();
}

  if (!HD || !HD.pt) return;
  const sh = $('#sheet'), top = 80, bot = innerHeight - (sh && sh.classList.contains('on') ? sh.offsetHeight : 0) - 30, y = HD.pt.y;
  if (y < top) scrollBy(0, -Math.min(14, (top - y) / 5 + 4)); else if (y > bot) scrollBy(0, Math.min(14, (y - bot) / 5 + 4));
  const key = HD.pt.x + ',' + y + ',' + scrollY; if (key === HD.key) return;   /* dito e pagina fermi: niente da ricalcolare */

  else if (c.ch != null) c.ch = null; else if (c.bk != null) c.bk = null; else return closeTop();
  refreshLayer(d); mhTop(d); if (c.bk == null) mhSavedCount(d);
};
async function mhSavedCount(d) {
  try {
    const lang = mhLang(), v = await mhVersions(), sv = (await mhSaved())[lang] || {}, s = d.querySelector('#mhdls');
    const n = MH_CODES.filter(c => sv[c] && (!v || sv[c] === mhVer(v, lang, c))).length, old = v ? MH_CODES.filter(c => sv[c] && sv[c] !== mhVer(v, lang, c)).length : 0;
    const t = d.querySelector('#mhtr');
    if (t && lang === 'it' && v) t.textContent = v.claude >= 5484 ? 'tradotto con Claude' : v.claude ? `tradotto con Claude: ${Math.floor(v.claude / 54.84)}%, il resto è provvisorio` : 'traduzione automatica provvisoria';
    if (s && !mhDL && (n || old)) s.textContent = (n >= 66 ? 'Tutti i 66 libri sono sul telefono: funziona anche senza internet.' : `${n} libr${n === 1 ? 'o' : 'i'} su 66 già sul telefono; gli altri si scaricano quando li apri.`) + (old ? ` ${old} con una versione nuova: tocca «Scarica tutto» per aggiornarli.` : '');
  } catch (e) {}
}
let mhDL = null;
ACT.mhdl = async (el, e, d) => {
  if (mhDL) return;
  if (!KV.db) return toast('Su questo telefono non si può salvare il commentario');
  const lang = mhLang(), v = await mhVersions(), sv = (await mhSaved())[lang] || {};
  const todo = MH_CODES.filter(c => !sv[c] || (v && sv[c] !== mhVer(v, lang, c)));
  if (!todo.length) return toast('Matthew Henry è già tutto sul telefono');
  mhDL = { done: 0, n: todo.length };
  const st = () => { const s = d.querySelector('#mhdls'); if (s) s.innerHTML = `<div class="prog"><b style="width:${Math.round(mhDL.done / mhDL.n * 100)}%"></b></div>Scarico ${mhDL.done} di ${mhDL.n} libri…`; };
  st(); let err = null;
  for (const code of todo) {
    try { await mhStore(lang, code, await mhFetch(lang, code), mhVer(v, lang, code)); MHC.delete(lang + ':' + code); } catch (x) { err = x; break; }
    mhDL.done++; st();
  }
  const n = mhDL.done; mhDL = null;
  toast(err ? 'Download interrotto: ' + err.message : `Matthew Henry è sul telefono (${n} libri scaricati)`);
  if (d.isConnected) { refreshLayer(d); mhSavedCount(d); }
};
ACT.mhdel = async (el, e, d) => {
  if (!confirmed(el, 'Sicuro?', 'Toglie Matthew Henry dal telefono: si riscarica quando lo riapri.')) return;
  for (const k of (await KV.keys()).filter(k => String(k).startsWith('mh:'))) await KV.del(k);
  MHC.clear(); _mhs = {}; toast('Matthew Henry tolto dal telefono'); if (d.isConnected) refreshLayer(d);
};
ACT.mhref = el => { const [bk, c1, v1, , v2] = el.dataset.r.split(',').map(Number); const vs = []; if (!(v1 === 1 && v2 === 999)) for (let v = v1; v <= Math.min(v2, v1 + 60); v++) vs.push(v); openMH(bk, c1, vs.length ? vs : null); };


/* importa (senza cancellare) i dati del prototipo salvati in localStorage: lp_sermons, lp_notes */
function migrateLegacy() {
  if (D.settings.legacyDone) return; D.settings.legacyDone = true;
  let ns = 0, nn = 0;
  try {
    const ser = JSON.parse(localStorage.getItem('lp_sermons') || '[]');
    const L = [['intro', 'Introduzione'], ['context', 'Contesto'], ['theme', 'Tema centrale'], ['points', 'Punti principali'], ['apply', 'Applicazioni'], ['end', 'Conclusione']];
    if (Array.isArray(ser)) ser.forEach(o => {
      if (!o || typeof o !== 'object') return;
      const pts = L.filter(([k]) => String(o[k] || '').trim()).map(([k, l]) => ({ id: uid(), text: l + '\n' + String(o[k]).trim(), verses: [] }));
      const r = o.ref ? parseRef(String(o.ref)) : null;
      if (r) { if (!pts.length) pts.push({ id: uid(), text: '', verses: [] }); pts[0].verses.push(r); }
      D.sermons.push({ id: uid(), title: String(o.title || 'Predicazione'), created: Date.now(), updated: Date.now(), points: pts }); ns++;
    });
  } catch (e) {}
  try {
    const nt = JSON.parse(localStorage.getItem('lp_notes') || '[]');
    if (Array.isArray(nt)) nt.forEach(o => {
      if (!o || o.type === 'Sottolineatura') return;
      const r = parseRef(String(o.ref || '')), text = String(o.text || '').trim(); if (!r || !text || r.c1 !== r.c2) return;
      D.notes.push({ id: uid(), bk: r.bk, ch: r.c1, v1: r.v1, v2: r.v2 === 999 ? r.v1 : r.v2, text, ts: Date.now() }); nn++;
    });
  } catch (e) {}
  save();
  if (ns + nn) setTimeout(() => toast(`Importati dal vecchio prototipo: ${ns} predicazioni, ${nn} appunti`), 800);
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
  /* il service worker apre subito la copia salvata e scarica in sottofondo la versione nuova: qui si avvisa */
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'update') offerUpdate(); });
  /* sul telefono l'app resta aperta in sottofondo e non si ricarica: quando torna in primo piano si controlla (al massimo una volta al minuto) */
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - _updT >= 60000) checkUpdate(); });
}
/* chiede index.html: il service worker scarica la versione pubblicata (e avvisa se è cambiata); se la copia salvata è già più nuova di questa pagina, si avvisa subito */
let _updT = Date.now();
async function checkUpdate() {
  _updT = Date.now();
  try { const m = (await (await fetch('./index.html', { cache: 'no-cache' })).text()).match(/const APP_VER = '(v [^']*)'/); if (m && m[1] !== APP_VER) offerUpdate(); } catch (e) {}
}
function offerUpdate() {
  toastAction('Nuova versione pronta · tocca per aggiornare', async () => {
    /* non si ricarica con un testo scritto e non ancora salvato (punto del sermone, nota…) */
    if ([...document.querySelectorAll('#layers textarea, #layers input[type=text]')].some(x => x.value !== x.defaultValue)) return toast('Prima salva il testo che stai scrivendo, poi aggiorna');
    try { await KV.set('data', D); } catch (er) {} location.reload();
  }, 20000);
}

/* ============ avvio ============ */
function renderAll() { applyTheme(); renderReader(); if (S.tab === 'ser') renderSermons(); if (S.tab === 'com') renderComm(); if (S.tab === 'me') renderMe(); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (f) f(t, e, t.closest('.layer'));
});
(async function boot() {
  await KV.init();
  const d = await KV.get('data');
  if (d) { D = Object.assign(D, d); D.settings = Object.assign({ size: 19, theme: 'carta', bible: null, last: { bk: 42, ch: 3 }, legend: {} }, d.settings || {}); }
  migrateLegacy();
  history.replaceState({ l: 0 }, '');
  if (D.settings.bible) await loadBible(D.settings.bible);
  if (!BIBLE && D.bibles.length) await loadBible(D.bibles[0].id);
  S.bk = D.settings.last.bk; S.ch = D.settings.last.ch;
  if (BIBLE && !hasBook(S.bk)) { S.bk = BOOKS.findIndex((_, i) => hasBook(i)); S.ch = 1; }
  renderAll(); window.__ready = true;
  /* i commentari (anche di diversi MB) si leggono dopo la prima schermata, non prima */
  requestAnimationFrame(() => setTimeout(async () => {
    try {
      const c = await KV.get('comms'); if (c && !C.list.length) C = c;
      _commsRes();
      if (S.tab === 'com') renderComm();
      if (S.sel) { _shKey = ''; showSheet(); }   /* aggiorna il numero di commentari sul pulsante */
    } catch (e) {}
  }, 0));
})();
