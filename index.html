<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243b32"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="La Parola"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>La Parola — Bibbia, Studio e Predicazione</title><style>

}
body.t-chiaro{--bg:#ffffff;--card:#ffffff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e5e5ea;--acc:#1d5fa8;--accsoft:#e4eefa;--bar:#fafafa;--flash:#fff0a8}

.view{display:none;padding-bottom:90px}.view.on{display:block}

.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none}

.cdot.x{background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--mute)}

.vchip{display:inline-flex;align-items:center;gap:4px;background:var(--accsoft);color:var(--acc);border-radius:10px;padding:5px 6px 5px 10px;font-weight:650;font-size:14px;margin:3px 4px 3px 0}

.toast.on{opacity:.96}
.bkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bkgrid button{text-align:left;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:15px}

.sech{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:16px 2px 8px;font-weight:700}

.sr{padding:10px 2px;border-bottom:1px solid var(--line)}

.pg-head{display:flex;align-items:center;gap:4px;position:sticky;top:0;background:var(--bar);z-index:5;padding:8px 8px;border-bottom:1px solid var(--line);min-height:54px}
.pg-head h2{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dark .pg-head{background:#151518}
.pad{padding:12px 14px}
.w.pr{background:var(--accsoft);box-shadow:0 2px 0 var(--acc)}
a.ref{text-decoration:underline;text-decoration-style:dotted;cursor:pointer}
mark{background:#ffe27a;color:#222;border-radius:3px}
.badge{display:inline-block;font-size:11.5px;background:var(--accsoft);color:var(--acc);border-radius:8px;padding:2px 7px;font-weight:650}

.danger{background:#b3382c!important;color:#fff!important;border-color:#b3382c!important}
.ib.danger{padding:0 12px;font-size:13px;font-weight:650}

<script>

/* ============ utilità ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ic = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
/* conferma con doppio tocco (niente confirm/alert/prompt) */
function confirmed(btn, q, msg) {
  if (btn.dataset.armed === '1') { clearTimeout(btn.armTimer); btn.dataset.armed = ''; return true; }
  btn.dataset.armed = '1'; btn.dataset.html = btn.innerHTML; btn.textContent = q || 'Sicuro?'; btn.classList.add('danger');
  btn.armTimer = setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.innerHTML = btn.dataset.html; btn.classList.remove('danger'); } }, 3500);
  if (msg) toast(msg);
  return false;
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' }); }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} a.remove(); return ok;
}
async function shareText(t, title) {
  if (navigator.share) { try { await navigator.share({ title: title || 'La Parola', text: t }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  toast((await copyText(t)) ? 'Copiato negli appunti' : 'Impossibile copiare');

const KV = {
  db: null,
  async init() {
    try { this.db = await new Promise((res, rej) => { const r = indexedDB.open('laparola', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
    catch (e) { this.db = null; }
  },
  get(k) {
    if (!this.db) { try { return Promise.resolve(JSON.parse(localStorage.getItem('lp_' + k))); } catch (e) { return Promise.resolve(null); } }
    return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => rej(q.error); });
  },
  set(k, v) {
    if (!this.db) { try { localStorage.setItem('lp_' + k, JSON.stringify(v)); } catch (e) { toast('Memoria piena: scarica un backup'); } return Promise.resolve(); }
    return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
  },
  del(k) {
    if (!this.db) { localStorage.removeItem('lp_' + k); return Promise.resolve(); }
    return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); });
  }
};

function applyColor(ci) {

function paintRuns(runs, ws, we, ci) {
  const out = [];
  for (const [a, b, c] of runs) {
    if (b < ws || a > we) { out.push([a, b, c]); continue; }
    if (a < ws) out.push([a, ws - 1, c]);
    if (b > we) out.push([we + 1, b, c]);
  }
  if (ci != null) out.push([ws, we, ci]);
  out.sort((x, y) => x[0] - y[0]);
  const m = []; for (const r of out) { const l = m[m.length - 1]; if (l && l[2] === r[2] && l[1] + 1 >= r[0]) l[1] = Math.max(l[1], r[1]); else m.push(r.slice()); }
  return m;
}

}

function runSearch(q, box) {

ACT.dlrived = async () => {

    const total = +res.headers.get('content-length') || 4300000; let got = 0, chunks = [];

    else { chunks.push(new Uint8Array(await res.arrayBuffer())); }

function hlItems() {

  if (q) {
    const r = parseRef(q); let res = [];
    if (r) { for (const c of C.list) for (const e of c.entries) { const hit = e.refs.filter(x => x.bk === r.bk && x.c1 <= r.c2 && x.c2 >= r.c1 && (r.c1 !== r.c2 || P(x.c2, x.v2) >= P(r.c1, r.v1) && P(x.c1, x.v1) <= P(r.c2, r.v2))); if (hit.length) res.push({ c, e, span: Math.min(...hit.map(refSpan)) }); } res.sort((a, b) => a.span - b.span); }
    else { const n = norm(q); for (const c of C.list) for (const e of c.entries) if (norm(e.title + ' ' + e.body).includes(n)) res.push({ c, e }); res = res.slice(0, 60); }
    h = `<div class="mut" style="padding:10px 16px 0">${res.length} risultat${res.length === 1 ? 'o' : 'i'}${r ? ' per ' + esc(refLabel(r)) : ''}</div>` + res.map(x => entryCard(x.c, x.e)).join('');
  } else {
    h = C.list.length ? C.list.map(c => `<div class="card tap" data-act="comopen" data-id="${c.id}"><h3>${esc(c.title)}</h3><div class="mut">${c.author ? esc(c.author) + ' · ' : ''}${c.entries.length} sezion${c.entries.length === 1 ? 'e' : 'i'}${c.entries.some(e => !e.refs.length) ? ' · ' + c.entries.filter(e => !e.refs.length).length + ' da associare' : ''}</div></div>`).join('') : `<div class="empty"><h2>Nessun commentario</h2>Aggiungi un commentario (testo incollato o file): le sezioni che iniziano con un riferimento, per esempio «Giovanni 3:16-21», si collegano da sole ai versetti. Poi, nel testo, tocca un versetto e «Commentario».</div>`;
  }
  box.innerHTML = h + (q ? '' : `<button class="btn fab" data-act="comadd">${ic('plus')} Aggiungi commentario</button>`);
}
const entryCard = (c, e) => `<div class="card tap" data-act="entopen" data-cid="${c.id}" data-eid="${e.id}"><div class="row w"><span class="ref">${e.refs.length ? esc(e.refs.map(refLabel).join(' · ')) : '<span class="badge">da associare</span>'}</span><span class="mut">${esc(c.title)}</span></div>${e.title ? `<div style="font-weight:650;margin-top:3px">${esc(e.title)}</div>` : ''}<div class="clamp mut" style="margin-top:3px">${esc(snippet(e.body))}</div></div>`;
ACT.comopen = el => openCommentary(el.dataset.id);
function openCommentary(cid) {
  openLayer('page', d => {
    const c = CM(cid); if (!c) return '<div class="empty">Non trovato</div>';
    const f = norm(d.ctx.f || '');
    const es = c.entries.filter(e => !f || norm(e.title + ' ' + e.body + ' ' + e.refs.map(refLabel).join(' ')).includes(f));
    return `<div class="pg-head"><button class="ib" data-act="close">${ic('back')}</button><h2>${esc(c.title)}</h2></div>
    <div class="chips"><button class="chip" data-act="entnew" data-cid="${cid}">${ic('plus')} Sezione</button><button class="chip" data-act="cominfo">${ic('pen')} Titolo / autore</button><button class="chip" data-act="comdel">${ic('trash')} Elimina</button></div>
    <div class="pad" style="padding-top:0"><input type="search" id="cf" value="${esc(d.ctx.f || '')}" placeholder="Filtra le sezioni…"></div>${es.map(e => entryCard(c, e)).join('') || '<div class="empty">Nessuna sezione</div>'}`;
  }, { ctx: { cid, f: '' } });
  const d = layers[layers.length - 1];
  d.mount = d => { const i = $('#cf', d); if (!i) return; i.oninput = () => { d.ctx.f = i.value; const pos = i.selectionStart; refreshLayer(d); const n = $('#cf', d); n.focus(); n.setSelectionRange(pos, pos); }; };
  d.mount(d);
}
ACT.cominfo = (el, e, d) => { const c = CM(d.ctx.cid); openLayer('sheet', () => `<h2 class="t">Commentario</h2><label class="l">Titolo</label><input type="text" id="cit" value="${esc(c.title)}"><label class="l">Autore</label><input type="text" id="cia" value="${esc(c.author || '')}"><div class="row" style="margin-top:14px"><button class="btn" data-act="cinsave">${ic('check')} Salva</button><button class="btn sec" data-act="close">Annulla</button></div>`, { ctx: { cid: d.ctx.cid } }); };
ACT.cinsave = (el, e, d) => { const c = CM(d.ctx.cid); c.title = $('#cit', d).value.trim() || c.title; c.author = $('#cia', d).value.trim(); saveC(); closeTop(); refreshTop(); renderComm(); };
ACT.comdel = (el, e, d) => { const c = CM(d.ctx.cid); if (!confirmed(el, 'Sicuro?')) return; C.list = C.list.filter(x => x !== c); saveC(); closeTop(); renderComm(); };

/* importazione */
ACT.comadd = () => {
  openLayer('sheet', () => `<h2 class="t">Aggiungi un commentario</h2>
  <label class="l">Titolo</label><input type="text" id="cmt" placeholder="Es. Commentario a Giovanni">
  <label class="l">Autore (facoltativo)</label><input type="text" id="cma">
  <label class="l">Libro (solo se le sezioni indicano soltanto «3:16-21» o «Capitolo 3»)</label>
  <select id="cmb"><option value="-1">— nessuno: i riferimenti contengono il nome del libro —</option>${BOOKS.map((b, i) => `<option value="${i}">${esc(b.n)}</option>`).join('')}</select>
  <label class="l">Testo</label><textarea id="cmx" placeholder="Incolla qui il commentario. Ogni sezione deve iniziare con un titolo che contiene il riferimento, per esempio:&#10;&#10;Giovanni 3:1-15 — Nicodemo&#10;testo del commento…&#10;&#10;Giovanni 3:16-21&#10;…"></textarea>
  <div class="row w" style="margin-top:8px"><button class="btn sec sm" data-act="cmfile">${ic('up2')} Da file (.txt .md .html .json)</button></div>
  <div class="hint" id="cmprev" style="margin-top:10px">Nessun testo</div>
  <div class="row" style="margin-top:12px"><button class="btn" data-act="cmsave">${ic('check')} Aggiungi</button><button class="btn sec" data-act="close">Annulla</button></div>`);
  const d = layers[layers.length - 1], upd = () => {
    const tx = $('#cmx', d).value; if (!tx.trim()) return $('#cmprev', d).textContent = 'Nessun testo';
    const r = buildEntries(tx, +$('#cmb', d).value), n = r.entries.filter(e => e.refs.length).length, un = r.entries.length - n;
    $('#cmprev', d).innerHTML = n ? `<b>${n}</b> sezion${n === 1 ? 'e riconosciuta' : 'i riconosciute'} e collegat${n === 1 ? 'a' : 'e'} ai versetti${un ? `, ${un} senza riferimento` : ''}.<br><span class="mut">${esc(r.entries.filter(e => e.refs.length).slice(0, 4).map(e => refLabel(e.refs[0])).join(' · '))}${n > 4 ? ' …' : ''}</span>` : 'Nessun riferimento riconosciuto: creo un’unica sezione che potrai associare ai versetti a mano.';
  };
  d.upd = upd; $('#cmx', d).oninput = upd; $('#cmb', d).onchange = upd;
};
ACT.cmfile = async (el, e, d) => {
  const f = await pickFile('.txt,.md,.html,.htm,.json,text/plain,text/html,application/json'); if (!f) return;
  let t = f.text; if (/\.html?$/i.test(f.name) || /<\/(p|div|h\d)>/i.test(t.slice(0, 3000))) t = htmlToText(t);
  $('#cmx', d).value = t; if (!$('#cmt', d).value) $('#cmt', d).value = f.name.replace(/\.[^.]+$/, ''); d.upd();
};
ACT.cmsave = (el, e, d) => {
  const tx = $('#cmx', d).value; if (!tx.trim()) return toast('Incolla o carica un testo');
  const r = buildEntries(tx, +$('#cmb', d).value); let entries = r.entries;
  if (!entries.some(x => x.refs.length) && entries.length <= 1) entries = [{ id: uid(), title: '', refs: [], body: tx.trim() }];
  const title = $('#cmt', d).value.trim() || r.title || 'Commentario senza titolo';
  C.list.push({ id: uid(), title, author: $('#cma', d).value.trim() || r.author || '', entries });
  saveC(); closeTop(); renderComm(); toast(`«${title}» aggiunto · ${entries.filter(x => x.refs.length).length} sezioni collegate`);
};

/* sezione (lettura / modifica / associazione) */
ACT.entopen = el => openEntry(el.dataset.cid, el.dataset.eid);
function openEntry(cid, eid, editing, isNew) {
  openLayer('page', d => {
    const c = CM(d.ctx.cid), e = c && c.entries.find(x => x.id === d.ctx.eid); if (!e) return '<div class="empty">Non trovato</div>';
    const head = `<div class="pg-head"><button class="ib" data-act="entback">${ic('back')}</button><h2>${esc(e.title || (e.refs[0] ? refLabel(e.refs[0]) : 'Sezione'))}</h2></div>`;
    const chips = `<div class="pad" style="padding-bottom:0"><div class="mut" style="margin-bottom:4px">${esc(c.title)} · versetti associati</div>${e.refs.map((r, j) => `<span class="vchip"><span data-act="vgo" data-bk="${r.bk}" data-c="${r.c1}" data-v="${r.v1 === 1 && r.v2 === 999 ? 0 : r.v1}">${esc(refLabel(r))}</span><button data-act="entunlink" data-j="${j}" aria-label="Rimuovi">${ic('x')}</button></span>`).join('') || '<span class="badge">nessuno</span> '}<button class="btn sec sm" data-act="entlink">${ic('link')} Associa versetti</button></div>`;
    if (d.ctx.editing) return head + chips + `<div class="pad"><label class="l">Titolo della sezione</label><input type="text" id="etit" value="${esc(e.title)}"><label class="l">Testo</label><textarea id="ebody" style="min-height:300px">${esc(e.body)}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-act="entsave">${ic('check')} Salva</button><button class="btn sec" data-act="entcancel">Annulla</button></div></div>`;
    const r0 = e.refs[0], bt = r0 && BIBLE ? `<details class="card" ${d.ctx.openText ? 'open' : ''}><summary style="font-weight:650;cursor:pointer">Testo biblico · ${esc(refLabel(r0))}</summary><div class="vquote" style="margin-top:8px">${vquote(r0.v2 - r0.v1 > 25 || r0.c2 !== r0.c1 ? { ...r0, c2: r0.c1, v2: Math.min(r0.v2, r0.v1 + 25) } : r0)}</div></details>` : '';
    return head + chips + bt + `<div class="pad body">${bodyHTML(e.body) || '<p class="mut">Sezione vuota.</p>'}</div><div class="pad row w"><button class="btn sec" data-act="entedit">${ic('pen')} Modifica</button><button class="btn sec" data-act="entdel">${ic('trash')} Elimina sezione</button></div>`;
  }, { ctx: { cid, eid, editing: !!editing, isNew: !!isNew, openText: true } });
}
const ENT = d => CM(d.ctx.cid).entries.find(x => x.id === d.ctx.eid);
ACT.entback = (el, e, d) => { if (d.ctx.isNew && !ENT(d).body) { const c = CM(d.ctx.cid); c.entries = c.entries.filter(x => x.id !== d.ctx.eid); saveC(); } closeTop(); };
ACT.entedit = (el, e, d) => { d.ctx.editing = true; refreshLayer(d); };
ACT.entcancel = (el, e, d) => { if (d.ctx.isNew && !ENT(d).body) return ACT.entback(el, e, d); d.ctx.editing = false; refreshLayer(d); };
ACT.entsave = (el, e, d) => { const en = ENT(d); en.title = $('#etit', d).value.trim(); en.body = $('#ebody', d).value.trim(); d.ctx.isNew = false; d.ctx.editing = false; saveC(); refreshLayer(d); };
ACT.entdel = (el, e, d) => { if (!confirmed(el, 'Sicuro?')) return; const c = CM(d.ctx.cid); c.entries = c.entries.filter(x => x.id !== d.ctx.eid); saveC(); closeTop(); setTimeout(() => { refreshTop(); renderComm(); }, 80); };
ACT.entunlink = (el, e, d) => { ENT(d).refs.splice(+el.dataset.j, 1); saveC(); refreshLayer(d); };
ACT.entlink = (el, e, d) => {
  const hasSel = S.sel && S.tab === 'read';
  openLayer('sheet', () => `<h2 class="t">Associa versetti a questa sezione</h2>${hasSel ? `<button class="btn block" data-act="entusesel" style="margin-bottom:12px">${ic('check')} Usa la selezione: ${esc(selRefs().map(refLabel).join(' · '))}</button>` : ''}<label class="l">Scrivi il riferimento</label><input type="text" id="lnk" placeholder="Es. Gv 3:16-21" autocomplete="off"><div class="mut" id="lnkm" style="margin-top:6px"></div><div class="row" style="margin-top:12px"><button class="btn" data-act="lnkok">${ic('check')} Associa</button><button class="btn sec" data-act="close">Annulla</button></div>`, { ctx: { parent: d } });
  const l = layers[layers.length - 1], i = $('#lnk', l); i.focus();
  i.oninput = () => { const r = parseRef(i.value); $('#lnkm', l).textContent = r ? '→ ' + refLabel(r) : (i.value ? 'Riferimento non riconosciuto' : ''); };
  i.onkeydown = e => { if (e.key === 'Enter') ACT.lnkok(null, null, l); };
};
function addLinks(entry, refs) { refs.forEach(r => { if (!entry.refs.some(x => JSON.stringify(x) === JSON.stringify(r))) entry.refs.push(r); }); saveC(); }
ACT.entusesel = (el, e, d) => { const p = d.ctx.parent; addLinks(ENT(p), selRefs()); closeTop(); refreshTop(); toast('Versetti associati'); };
ACT.lnkok = (el, e, d) => { const r = parseRef($('#lnk', d).value); if (!r) return toast('Riferimento non riconosciuto'); const p = d.ctx.parent; addLinks(ENT(p), [r]); closeTop(); refreshTop(); toast('Versetti associati'); };
ACT.entnew = (el, e, d) => { const c = CM(el.dataset.cid), en = { id: uid(), title: '', body: '', refs: [] }; c.entries.push(en); saveC(); openEntry(c.id, en.id, true, true); };

/* dal versetto al commentario */
ACT.comments = () => {
  const refs = selRefs(), vs = [...S.sel.verses], bk = S.bk, ch = S.ch;
  openLayer('page', d => {
    const res = commentsFor(bk, ch, vs);
    return `<div class="pg-head"><button class="ib" data-act="close">${ic('back')}</button><h2>Commentari · ${esc(refs.map(refLabel).join(' · '))}</h2></div>
    ${res.length ? res.map(x => entryCard(x.c, x.e)).join('') : `<div class="empty"><h2>Nessun commentario associato</h2>Nessuna sezione dei tuoi commentari tratta questi versetti.</div>`}
    <div class="pad"><div style="display:grid;gap:10px"><button class="btn sec" data-act="cpick">${ic('link')} Associa una sezione esistente</button><button class="btn sec" data-act="cmine">${ic('pen')} Scrivi un mio commento qui</button></div></div>`;
  }, { ctx: { refs } });
};
ACT.cmine = (el, e, d) => {
  let c = C.list.find(x => x.id === 'mine'); if (!c) { c = { id: 'mine', title: 'I miei commenti', author: '', entries: [] }; C.list.push(c); }
  const en = { id: uid(), title: '', body: '', refs: d.ctx.refs.map(r => ({ ...r })) }; c.entries.push(en); saveC(); renderComm(); openEntry('mine', en.id, true, true);
};
ACT.cpick = (el, e, d) => {
  openLayer('page', l => {
    const c = l.ctx;
    if (!c.cid) return `<div class="pg-head"><button class="ib" data-act="close">${ic('back')}</button><h2>Scegli il commentario</h2></div>${C.list.map(x => `<div class="card tap" data-act="cpickc" data-id="${x.id}"><h3>${esc(x.title)}</h3><div class="mut">${x.entries.length} sezioni</div></div>`).join('') || '<div class="empty">Nessun commentario: aggiungine uno dalla scheda Commentari.</div>'}`;
    const cm = CM(c.cid), f = norm(c.f || '');
    const es = cm.entries.filter(e => !f || norm(e.title + ' ' + e.body + ' ' + e.refs.map(refLabel).join(' ')).includes(f));
    return `<div class="pg-head"><button class="ib" data-act="cpickback">${ic('back')}</button><h2>${esc(cm.title)}</h2></div><div class="pad"><input type="search" id="cpf" value="${esc(c.f || '')}" placeholder="Filtra le sezioni…"><div class="mut" style="margin-top:6px">Tocca la sezione da associare a ${esc(c.refs.map(refLabel).join(' · '))}</div></div>${es.slice(0, 80).map(e => `<div class="card tap" data-act="cpicke" data-eid="${e.id}"><div class="row w"><span class="ref">${e.refs.length ? esc(e.refs.map(refLabel).join(' · ')) : '<span class="badge">da associare</span>'}</span></div>${e.title ? `<div style="font-weight:650">${esc(e.title)}</div>` : ''}<div class="clamp mut">${esc(snippet(e.body))}</div></div>`).join('')}`;
  }, { ctx: { refs: d.ctx.refs, cid: null, f: '' } });
  const l = layers[layers.length - 1];
  l.mount = l => { const i = $('#cpf', l); if (i) i.oninput = () => { l.ctx.f = i.value; const p = i.selectionStart; refreshLayer(l); const n = $('#cpf', l); n.focus(); n.setSelectionRange(p, p); }; };
  l.mount(l);
};
ACT.cpickc = (el, e, d) => { d.ctx.cid = el.dataset.id; d.ctx.f = ''; refreshLayer(d); };
ACT.cpickback = (el, e, d) => { d.ctx.cid = null; refreshLayer(d); };
ACT.cpicke = (el, e, d) => { const en = CM(d.ctx.cid).entries.find(x => x.id === el.dataset.eid); addLinks(en, d.ctx.refs); closeTop(); setTimeout(refreshTop, 80); toast('Sezione associata ai versetti'); };


/* importa (senza cancellare) i dati del prototipo salvati in localStorage: lp_sermons, lp_notes */
function migrateLegacy() {
  if (D.settings.legacyDone) return; D.settings.legacyDone = true;
  let ns = 0, nn = 0;
  try {
    const ser = JSON.parse(localStorage.getItem('lp_sermons') || '[]');
    const L = [['intro', 'Introduzione'], ['context', 'Contesto'], ['theme', 'Tema centrale'], ['points', 'Punti principali'], ['apply', 'Applicazioni'], ['end', 'Conclusione']];
    if (Array.isArray(ser)) ser.forEach(o => {
      if (!o || typeof o !== 'object') return;
      const pts = L.filter(([k]) => String(o[k] || '').trim()).map(([k, l]) => ({ id: uid(), text: l + '\n' + String(o[k]).trim(), verses: [] }));
      const r = o.ref ? parseRef(String(o.ref)) : null;
      if (r) { if (!pts.length) pts.push({ id: uid(), text: '', verses: [] }); pts[0].verses.push(r); }
      D.sermons.push({ id: uid(), title: String(o.title || 'Predicazione'), created: Date.now(), updated: Date.now(), points: pts }); ns++;
    });
  } catch (e) {}
  try {
    const nt = JSON.parse(localStorage.getItem('lp_notes') || '[]');
    if (Array.isArray(nt)) nt.forEach(o => {
      if (!o || o.type === 'Sottolineatura') return;
      const r = parseRef(String(o.ref || '')), text = String(o.text || '').trim(); if (!r || !text || r.c1 !== r.c2) return;
      D.notes.push({ id: uid(), bk: r.bk, ch: r.c1, v1: r.v1, v2: r.v2 === 999 ? r.v1 : r.v2, text, ts: Date.now() }); nn++;
    });
  } catch (e) {}
  save();
  if (ns + nn) setTimeout(() => toast(`Importati dal vecchio prototipo: ${ns} predicazioni, ${nn} appunti`), 800);
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));

/* ============ avvio ============ */
function renderAll() { applyTheme(); renderReader(); if (S.tab === 'ser') renderSermons(); if (S.tab === 'com') renderComm(); if (S.tab === 'me') renderMe(); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (f) f(t, e, t.closest('.layer'));
});
(async function boot() {
  await KV.init();
  const d = await KV.get('data');
  if (d) { D = Object.assign(D, d); D.settings = Object.assign({ size: 19, theme: 'carta', bible: null, last: { bk: 42, ch: 3 }, legend: {} }, d.settings || {}); }
  const c = await KV.get('comms'); if (c) C = c;
  migrateLegacy();
  history.replaceState({ l: 0 }, '');
  if (D.settings.bible) await loadBible(D.settings.bible);
  if (!BIBLE && D.bibles.length) await loadBible(D.bibles[0].id);
  S.bk = D.settings.last.bk; S.ch = D.settings.last.ch;
  if (BIBLE && !hasBook(S.bk)) { S.bk = BOOKS.findIndex((_, i) => hasBook(i)); S.ch = 1; }
  renderAll(); window.__ready = true;
})();
</script></body></html>
